# Names of variables to compare: SSH, SST, SSS, CURR
variables:
  - SSH
  - SST
  - SSS
  - CURR

# Must be in the same order as the variables.
units:
  - m
  - degC
  - PSU
  - m/s

# Ordered in following sequence: 1. control or production; 2. exp 1; 3. exp2
systems:
  - v2p4
  - v2p5
  - v2p5_nco

regions:
  - Global
  - Arctic
  - Antarctic
  - Eq_Pac
  - Trop
  - Atlantic
  - e_Pac

# Path where plots are to be saved
output_path: /lfs/h2/emc/ptmp/santha.akella/dashboard/

# Plot each system?
plot_each: False

# Compare all systems in a single plot?
compare_all: True

v2p4:
 name: prod
 data_path: /u/santha.akella/rtofs_02June2025/scripts/UFS_helpers/scratch_v2p4

v2p5:
 name: para
 data_path: /u/santha.akella/rtofs_02June2025/scripts/UFS_helpers/scratch_v2p5

v2p5_nco:
 name: NCO para
 data_path: /u/santha.akella/rtofs_02June2025/scripts/UFS_helpers/scratch_v2p5_nco
