# Names of variables to compare: SSH, SST, SSS, CURR
variables:
  - SSH

# Must be in the same order as the variables.
units:
  - m

# Ordered in following sequence: 1. control or production; 2. exp 1; 3. exp2
systems:
  - v2p4
  - v2p5
  - v2p5_bad

regions:
  - Global
  - Arctic
  - Antarctic
  - Eq_Pac
  - Trop
  - Atlantic
  - e_Pac

# Path where plots are to be saved
output_path: /lfs/h2/emc/ptmp/santha.akella/dashboard/

# Plot each system?
plot_each: False

# Compare all systems in a single plot?
compare_all: True

v2p4:
 name: production
 data_path: /u/santha.akella/tmp/plot_converted_nc/scripts/UFS_helpers/scratch_v2p4

v2p5:
 name: parallel
 data_path: /u/santha.akella/tmp/plot_converted_nc/scripts/UFS_helpers/scratch_v2p5

v2p5_bad:
 name: bad parallel
 data_path: /u/santha.akella/tmp/plot_converted_nc/scripts/UFS_helpers/scratch_v2p5_bad
